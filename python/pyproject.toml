[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pghybrid"
version = "0.1.0"
description = "Hybrid search on the Postgres you already have. Vector + full-text + Reciprocal Rank Fusion on plain pgvector, with no extensions to install."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Pavan Gupta", email = "pavan.gupta.352@gmail.com" }]
keywords = [
    "postgres", "postgresql", "pgvector", "hybrid-search", "rrf",
    "reciprocal-rank-fusion", "full-text-search", "vector-search",
    "semantic-search", "rag", "retrieval", "tsvector", "bm25", "supabase",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# No runtime dependencies. The package generates SQL and hands it to whatever
# driver the caller already uses.
dependencies = []

[project.optional-dependencies]
cli = ["psycopg[binary]>=3.1"]
dev = [
    "psycopg[binary]>=3.1",
    # The ORM adapters are only worth shipping if they are exercised against a real
    # server, so the libraries they wrap are test dependencies.
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    # The concurrency test holds one HybridSearch across threads backed by a pool,
    # which is how a web application uses it.
    "psycopg-pool>=3.2",
    # For examples/langchain_retriever.py. Not a dependency of the package: the glue
    # lives in an example so this library never owns LangChain's version matrix. CI runs
    # it so the example cannot rot unnoticed.
    "langchain-core>=0.3",
    "django>=4.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/pavangupta352/pghybrid"
Repository = "https://github.com/pavangupta352/pghybrid"
Issues = "https://github.com/pavangupta352/pghybrid/issues"
Changelog = "https://github.com/pavangupta352/pghybrid/blob/main/CHANGELOG.md"

[project.scripts]
pghybrid = "pghybrid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pghybrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Postgres with pgvector"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP045 rewrites Optional[X] to X | None. Annotations are strings here thanks to
# `from __future__ import annotations`, so both forms run on 3.9 — but only the
# Optional form survives a runtime typing.get_type_hints() call there, and the
# package supports 3.9. Not worth 65 rewrites to lose that.
ignore = ["UP045", "UP007"]

[tool.mypy]
# mypy no longer accepts 3.9 as a target. requires-python stays >=3.9;
# this only sets which syntax mypy assumes while checking.
python_version = "3.10"
strict = true

# Django ships no py.typed marker. The adapter touches exactly one symbol from it and
# is exercised against a real Django connection in the integration suite.
[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true
