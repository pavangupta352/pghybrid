[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pghybrid"
version = "0.1.0"
description = "Hybrid search on the Postgres you already have. Vector + full-text + Reciprocal Rank Fusion on plain pgvector, with no extensions to install."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Pavan Gupta", email = "pavan.gupta.352@gmail.com" }]
keywords = [
    "postgres", "postgresql", "pgvector", "hybrid-search", "rrf",
    "reciprocal-rank-fusion", "full-text-search", "vector-search",
    "semantic-search", "rag", "retrieval", "tsvector", "bm25", "supabase",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# No runtime dependencies. The package generates SQL and hands it to whatever
# driver the caller already uses.
dependencies = []

[project.optional-dependencies]
cli = ["psycopg[binary]>=3.1"]
dev = [
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/pavangupta352/pghybrid"
Repository = "https://github.com/pavangupta352/pghybrid"
Issues = "https://github.com/pavangupta352/pghybrid/issues"
Changelog = "https://github.com/pavangupta352/pghybrid/blob/main/CHANGELOG.md"

[project.scripts]
pghybrid = "pghybrid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pghybrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Postgres with pgvector"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
