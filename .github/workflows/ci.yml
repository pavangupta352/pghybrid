name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole suite before it publishes anything.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} / pgvector ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
        pg: ["pg17"]
        include:
          # The ends of the supported range, checked once each rather than against every
          # Python: the SQL is what varies by server version, not the client. pg13 is the
          # oldest image pgvector publishes, so it is the oldest version claimed.
          - python: "3.13"
            pg: "pg13"
          - python: "3.13"
            pg: "pg15"
    services:
      postgres:
        # Stock pgvector image with nothing added. The integration suite asserts that
        # only "vector" is ever created, which is the project's central claim.
        image: pgvector/pgvector:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: pghybrid
          POSTGRES_DB: pghybrid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pghybrid"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGHYBRID_TEST_DSN: postgresql://postgres:pghybrid@localhost:5432/pghybrid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: python
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Lint
        working-directory: python
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Types
        working-directory: python
        run: .venv/bin/mypy src
      - name: Test
        working-directory: python
        run: .venv/bin/python -m pytest -q --cov=pghybrid --cov-report=term-missing

  typescript:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pghybrid
          POSTGRES_DB: pghybrid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pghybrid"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGHYBRID_TEST_DSN: postgresql://postgres:pghybrid@localhost:5432/pghybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        working-directory: js
        run: npm ci
      - name: Lint and types
        working-directory: js
        run: npm run lint && npm run typecheck
      - name: Test
        working-directory: js
        run: npm test

  parity:
    name: python and typescript generate identical SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install both
        run: |
          cd python && uv venv && uv pip install -e ".[dev]" && cd ..
          cd js && npm ci && cd ..
      # Two implementations of the same query generator will drift apart unless
      # something fails when they do. Both render the same fixtures and the outputs
      # are compared byte for byte.
      - name: Compare generated SQL
        run: node scripts/check_parity.mjs

  sql:
    name: standalone SQL runs unmodified
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pghybrid
          POSTGRES_DB: pghybrid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pghybrid"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGHYBRID_TEST_DSN: postgresql://postgres:pghybrid@localhost:5432/pghybrid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The files in sql/ are a supported way to use this project, so they are tested
      # like code rather than treated as documentation.
      - name: Run sql/migration.sql and sql/hybrid_search.sql
        run: |
          cd python && uv venv && uv pip install -e ".[dev]" && cd ..
          python/.venv/bin/python scripts/check_standalone_sql.py
      # Sample output in a README rots quietly, and a reader who runs the command and
      # sees something different stops trusting the rest of the page.
      - name: README output still matches what the tool prints
        run: python/.venv/bin/python scripts/check_readme_output.py
      # And the code the README tells people to copy is run, not just read. Both
      # quickstarts were broken when this was added: the Python one printed None for
      # every title because it asked for a column the config never selected, and the
      # TypeScript one imported a type as a value, which fails under the tsconfig
      # TypeScript 5 recommends. Neither could be seen by any other check here.
      - name: Documentation code blocks still run
        run: |
          cd js && npm ci && cd ..
          python/.venv/bin/python scripts/check_docs_code.py
      # The demo above the fold is drawn from a live query, so it cannot show a result
      # the code does not produce. This is what keeps that true.
      - name: Demo image still matches a live query
        run: python/.venv/bin/python scripts/make_demo_svg.py --check
      # The examples are the shortest path from reading to running, so they are run too.
      - name: Examples still work
        run: |
          python/.venv/bin/python examples/three_way_comparison.py
          python/.venv/bin/python examples/langchain_retriever.py

  packaging:
    name: the artifacts install and work from empty environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Every other job runs against the working tree, which cannot catch a file that
      # exists in the repo and never reaches the artifact. py.typed was exactly that:
      # the package checked itself under mypy --strict and shipped no marker, so every
      # consumer saw Any.
      - name: Install both toolchains
        run: |
          cd python && uv venv && uv pip install -e ".[dev]" && cd ..
          cd js && npm ci && cd ..
      - name: Build, install and use both packages as a stranger would
        run: python/.venv/bin/python scripts/check_packaging.py

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
